name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.11

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -

    - name: Install dependencies
      run: poetry install

    - name: Set up PyPi token
      run: poetry config pypi-token.pypi ${{ secrets.PYPI_DEPLOY_TOKEN }}

    - name: Build package
      run: poetry build

    # 🛡️ ProofCore: Cryptographic supply-chain notarization for PyPI distribution packages
    - name: Notarize PyPI Distribution Packages via ProofCore
      uses: ProofCore-Protocol/proofcore-action@v1
      continue-on-error: true
      with:
        files: "dist/*"

    - name: Upload to PyPI
      run: poetry publish

  docker:
    needs: pypi
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ackeeblockchain/wake:${{ github.event.release.tag_name }}

  purge_cache:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: true

    - name: Purge Cloudflare Cache
      run: ./purge_cache.sh
      env:
        DOMAIN_ZONE_ID: ${{ secrets.CF_DOMAIN_ZONE_ID }}
        DOMAIN_TOKEN: ${{ secrets.CF_DOMAIN_TOKEN }}
